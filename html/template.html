<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
<!--小红书首页的初始化界面-->
<div class="page" id="jjc_app">
    <div class="page-wrapper pb-3 border" style="border-radius: 1rem">
        <div class="page-body">
            <div class="container-xl">
                <div class="box">
                    <header class="navbar navbar-expand-md d-print-none mb-3 border-bottom pb-3">
                        <div class="container-xl">
                            <div class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
                                <div class="nav-link d-flex lh-1 text-reset p-0" data-bs-toggle="dropdown"
                                     aria-label="Open user menu" aria-expanded="false" style="max-height: 2rem;">
                                    <div style="width: 2rem; height: 2rem; overflow: hidden;">
                                        <a href="http://1.14.138.236" target="_blank">
                                            <img class="avatar avatar-sm" id="logo"
                                                 src="chrome-extension://gddajbflcjmfpmgenphmlejfdkffeeof/images/16.png"
                                                 alt="Avatar"
                                                 style="width: 100%; height: 100%; object-fit: cover;">
                                        </a>
                                    </div>
                                    <div class="d-xl-block ps-2">
                                        <a href="http://1.14.138.236" target="_blank">景查查-冲冲冲!!</a>
                                        <small class="text-truncate text-muted" style="max-width: 15rem"><p
                                                class="mt-2 mb-1 small text-secondary" id="say_what"></p>
                                        </small>
                                    </div>
                                </div>
                            </div>
                            <div class="navbar-nav flex-row order-md-last">
                                <div class="nav-item dropdown d-flex">
                                    <a href="#" class="nav-link d-flex lh-1 p-0 text-no-wrap"
                                       data-bs-toggle="dropdown" aria-label="Open user menu"
                                       style="width: 2rem; height: 2rem;">
                                        <img class="avatar avatar-sm" id="user_avatar"
                                             src="chrome-extension://gddajbflcjmfpmgenphmlejfdkffeeof/images/16.png"
                                             alt="Avatar"
                                             style="width: 100%; height: 100%; object-fit: cover;">
                                    </a>
                                    <div class="d-none d-xl-block ps-2">
                                        <div id="user_name">Kellie Skingley</div>
                                        <div class="small text-secondary">forever young</div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </header>
                    <header class="navbar-expand-md d-print-none pb-3">
                        <div class="navbar">
                            <div class="container-xl">
                                <div class="row">
                                    <div class="col-auto">
                                        <a class="btn btn-outline-primary"
                                           id="showBoomTable">
                                            潜在爆文
                                        </a>
                                    </div>
                                    <div class="col-auto">
                                        <a class="btn btn-outline-primary"
                                           id="showRecentTable">
                                            最近自发

                                        </a>
                                    </div>


                                </div>
                            </div>

                    </header>
                </div>

            </div>
        </div>
    </div>
    <div class="modal modal-blur" id="boom_pv_modal">
        <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
            <div class="modal-content tab-pane">
                <div class="alert alert-black mb-0" role="alert">
                    <h3 class="mb-1">潜在爆文</h3>
                    <p>下列为最近15天发布200赞以上，具有爆文潜力的图文，请做好维护！</p>
                    <hr class="mb-1">

                    <div class="table-responsive">
                        <table class="table card-table table-vcenter text-nowrap datatable"
                               id="BoomTable">
                            <thead>
                            <tr>
                                <th>标题</th>
                                <th>点赞</th>
                                <th>评论</th>
                                <th>产品</th>
                                <th>所属PR</th>
                                <th>
                                    <div class="d-flex justify-content-center">平台</div>
                                </th>
                                <th>发布时间</th>
                                <th>导入时间</th>
                            </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

                </div>
            </div>
        </div>
    </div>
    <div class="modal modal-blur" id="recent_pv_modal">
        <div class="modal-dialog modal-lg modal-dialog-centered " role="document">
            <div class="modal-content tab-pane">
                <div class="alert alert-black mb-0" role="alert">
                    <h3 class="mb-1">最近导入</h3>
                    <p>下列为最近7天导入到网站的图文，有些数据预计24小时内更新</p>
                    <hr class="mb-1">

                    <div class="table-responsive">
                        <table class="table card-table table-vcenter text-nowrap datatable"
                               id="RecentTable">
                            <thead>
                            <tr>
                                <th>标题</th>
                                <th>点赞</th>
                                <th>评论</th>
                                <th>产品</th>
                                <th>所属PR</th>
                                <th>
                                    <div class="d-flex justify-content-center">平台</div>
                                </th>
                                <th>发布时间</th>
                                <th>导入时间</th>

                            </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>

                </div>
            </div>
        </div>
    </div>
</div>
<div class="form-check col-auto" id="checkBox">
    <input type="checkbox" class="form-check-input linkCheck" id="customCheck1">
    <label class="custom-control-label" for="customCheck1">选择当前图文</label>
</div>
<div class="page" id="jjc_xhs_product">
    <div class="page-wrapper pb-3 border" style="border-radius: 1rem">
        <div class="page-body">
            <div class="container-xl">
                <div class="box">
                    <header class="navbar navbar-expand-md d-print-none mb-3 border-bottom pb-3">
                        <div class="container-xl">
                            <div class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
                                <div class="nav-link d-flex lh-1 text-reset p-0" data-bs-toggle="dropdown"
                                     aria-label="Open user menu" aria-expanded="false" style="max-height: 2rem;">
                                    <div style="width: 2rem; height: 2rem; overflow: hidden;">
                                        <a href="http://1.14.138.236" target="_blank">
                                            <img class="avatar avatar-sm" id="logo"
                                                 src="chrome-extension://gddajbflcjmfpmgenphmlejfdkffeeof/images/16.png"
                                                 alt="Avatar"
                                                 style="width: 100%; height: 100%; object-fit: cover;">
                                        </a>
                                    </div>
                                    <div class="d-xl-block ps-2">
                                        <a href="http://1.14.138.236" target="_blank">景查查-冲冲冲!!</a>
                                        <small class="text-truncate text-muted" style="max-width: 15rem"><p
                                                class="mt-2 mb-1 small text-secondary" id="say_what"></p>
                                        </small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>
                    <header class="navbar-expand-md d-print-none">
                        <div class="navbar">
                            <div class="container-xl  border-bottom pb-3 ">
                                <div class="row">
                                    <div class="col-sm-auto col-lg-auto justify-content-start align-items-center d-flex">
                                        <select name="InsertKeyWord"
                                                class="form-select form-control btn-outline-primary me-1">
                                            <option value="万明">万明</option>
                                            <option value="万明鞋胶">万明鞋胶</option>
                                            <option value="万明强力胶">万明强力胶</option>
                                            <option value="万明胶水">万明胶水</option>
                                            <option value="MYDCT鞋胶">MYDCT鞋胶</option>
                                            <option value="MYDCT">MYDCT胶水</option>
                                        </select>
                                        <a class="btn btn-outline-primary form-control makeComments">
                                            生成评论
                                        </a>

                                    </div>
                                </div>
                            </div>
                            <div class="container-xl pt-3 ">
                                <div class="row">
                                    <small class="text-truncate" style="max-width: 15rem"><a
                                            class="mt-2 mb-1 cursor-pointer" target="_blank" id="has_promotion_a"></a>
                                    </small>
                                </div>
                            </div>
                        </div>
                </div>

                </header>
            </div>

        </div>
    </div>
</div>
<div class="page xhs_container" id="xhs_container">
    <div class="page-wrapper pb-3 border" style="border-radius: 1rem">
        <div class="page-body">
            <div class="container-xl">
                <div class="box">
                    <header class="navbar-expand-md d-print-none">
                        <div class="navbar">
                            <div class="container-xl pt-3 ">
                                <div class="row">
                                    <small class="text-truncate" style="max-width: 15rem"><a
                                            class="mt-2 mb-1 cursor-pointer" target="_blank" id="has_promotion_a"></a>
                                    </small>
                                </div>
                            </div>
                        </div>
                </div>

                </header>
            </div>

        </div>
    </div>
</div>
<div class="modal modal-blur fade" id="BrandModal">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title">混淆品牌</h5>
                    <small>输入需要混淆的整段文本，返回混淆品牌词后的文本</small>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="mb-3">
                            <input type="text" class="form-control ps-0" value="" autocomplete="off"
                                   name="change_brand_input"
                                   placeholder="输入需要混淆的文本">
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-link link-danger" id="showFileChangeBrandModal">
                    批量修改
                </button>
                <button class="btn btn-primary ms-auto" id="changeBrand">
                    <!-- Download SVG icon from http://tabler-icons.io/i/plus -->
                    修改品牌文本
                </button>
            </div>
        </div>
    </div>
</div>
<div class="modal modal-blur fade" id="FileBrandModal">
    <div class="modal-dialog modal-lg modal-dialog-centered" role="document">
        <div class="modal-content card">
            <div class="tab-pane active show" id="tabs-pro" role="tabpanel">
                <div class="card-body border-top-0">
                    <div class="col-12 pb-3">
                        <small>批量混淆品牌词</small>
                        <form class="dropzone form-control " action="../" autocomplete="off" novalidate="">
                            <div class="fallback">
                                <input name="changeBrandFile" type="file"
                                       accept="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
                            </div>
                        </form>
                        <div class="d-flex mt-2 justify-content-start align-items-center">
                            <div class="col-auto px-2 ms-auto">
                                <span class="btn btn-link" id="InputChangeBrand">下载模板</span>
                            </div>
                            <div class="px-2 col-2">
                                <button type="button"
                                        class="btn  btn-primary w-100" id="changeBrandFile">
                                    提交
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
</body>
</html>
